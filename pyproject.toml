[tool.poetry]
name = "paint-box"
version = "0.1.0"
description = "Computer vision project for detecting QR codes and ROI in a paint box"
authors = ["Paint Box Contributors"]
readme = "README.md"
packages = [{include = "paint_box", from = "src"}]
license = "MIT"

[tool.poetry.dependencies]
python = ">=3.10, !=3.14.1, <4.0"
opencv-python-headless = ">=4.8,<4.10"
numpy = "^1.26"
Pillow = "^10.4"
pytesseract = "^0.3.10"
tree = "^0.2.4"
transformers = "^5.17.0"
torch = "^2.14.0"
notebook = "^7.6.3"
torchvision = "^0.29.0"
pyyaml = "^6.0.3"
tqdm = "^4.70.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^5.0"
black = "^24.10"
flake8 = "^7.1"
isort = "^5.13"
mypy = "^1.13"
qrcode = "^7.4"
datasets = "^5.0.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--cov=src", "--cov-report=term-missing"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line-length = 88

[tool.mypy]
python_version = "3.10"
strict = true

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203"]
